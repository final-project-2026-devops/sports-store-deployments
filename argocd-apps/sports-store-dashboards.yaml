apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sports-store-dashboards
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sports-store
  source:
    repoURL: 'https://github.com/final-project-2026-devops/sports-store-deployments.git'
    targetRevision: HEAD
    path: monitoring/dashboards
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
