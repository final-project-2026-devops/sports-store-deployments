{{- range $name, $svc := .Values.services }}
{{- if $svc.env }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "sports-store.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
data:
  {{- range $k, $v := $svc.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
{{- end }}
{{- end }}
